services:
  postgres:
    image: postgres:16
    container_name: teamboard-postgres
    environment:
      - POSTGRES_USER=teamboard
      - POSTGRES_PASSWORD=teamboard_dev
      - POSTGRES_DB=teamboard
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data  # 这里必须是 data

volumes:
  pg_data: